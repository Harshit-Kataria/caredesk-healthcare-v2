services:
  - type: web
    name: caredesk-healthcare
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: AI_PROVIDER
        value: mock
      - key: PAYMENT_MODE
        value: sandbox
      - key: PAYMENT_PROVIDER
        value: mock
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: caredesk-data
      mountPath: /var/data
      sizeGB: 1
